<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Download APK RoomBooking</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #11151b;
        color: #f4f6f8;
        font-family: Arial, sans-serif;
      }
      main { text-align: center; padding: 24px; }
      h1 { margin: 0 0 28px; font-size: 30px; }
      a {
        display: inline-block;
        padding: 18px 32px;
        border-radius: 12px;
        background: #0b6b3a;
        color: #fff;
        font-size: 22px;
        font-weight: bold;
        text-decoration: none;
      }
      a.secondary {
        display: block;
        margin-top: 18px;
        background: transparent;
        border: 2px solid #3d4a58;
        color: #cfd8e3;
        font-size: 17px;
      }
      p { margin: 14px 0 0; color: #8894a1; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>RoomBooking Kiosk</h1>
      <a id="apk-download" href="kiosk-release.apk" download>Download APK</a>
      <p id="apk-version">Versi terbaru</p>
      <a class="secondary" href="webview-138.0.7204.179-armeabi-v7a.apk" download>Download WebView 138 (Android 8–9)</a>
      <p>Hanya jika halaman kiosk kosong/putih karena WebView bawaan terlalu tua.</p>
    </main>
    <script>
      // latest.json is the same manifest the kiosk polls, so a release only
      // updates the APK and that one file. Fallback text stays version-free so
      // it can never go stale.
      fetch("latest.json", { cache: "no-store" })
        .then((response) => (response.ok ? response.json() : Promise.reject(new Error("manifest"))))
        .then((manifest) => {
          document.getElementById("apk-download").href = manifest.url;
          document.getElementById("apk-version").textContent =
            `Versi ${manifest.versionName} (${manifest.versionCode}) · SHA-256 ${manifest.sha256.slice(0, 12)}`;
        })
        .catch(() => {
          // Leave the fallback text and link in place.
        });
    </script>
  </body>
</html>
