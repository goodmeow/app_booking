# Single-origin entry point for the Alpine stack: static CMS at the root,
# API and Socket.io proxied to the app container on the Compose network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Same policy as server/express.js. Locations below that add their own
    # headers must repeat it, because nginx drops the inherited set.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # SPA fallback: every path that is not a real file goes to index.html.
    location / {
        try_files $uri /index.html;
    }

    # The server mounts its routes under /api, so the prefix is kept (no
    # trailing slash on proxy_pass).
    location /api/ {
        proxy_pass http://app:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://app:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # The APK is downloaded by tablets; do not let nginx cache a stale build.
    location = /apk/kiosk-release.apk {
        add_header Cache-Control "no-cache";
    }

    # The kiosk checks this manifest every six hours. Never serve a stale JSON.
    location = /apk/latest.json {
        add_header Cache-Control "no-store";
    }
}
