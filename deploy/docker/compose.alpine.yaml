# Alpine demo/test stack. Never reuse these credentials outside a local run.
#
# Build context is the repository root, so run from the repo root and pass the
# env file explicitly (compose v2 resolves .env next to this file, not the cwd):
#   docker-compose --env-file .env -f deploy/docker/compose.alpine.yaml \
#     -p roombooking-alpine up -d --build
#
# Face unlock needs the ONNX models (face-service/fetch-models.sh) and an
# ALPINE_FACE_EMBEDDING_KEY in the env file. Recreating the app container
# changes its IP, so restart the web container so nginx re-resolves "app".

services:
  db:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.postgres
    image: roombooking-postgres:16.15-gosu1.19
    environment:
      POSTGRES_DB: ${ALPINE_PGDATABASE:-360booking}
      POSTGRES_USER: ${ALPINE_PGUSER:-booking}
      POSTGRES_PASSWORD: ${ALPINE_PGPASSWORD:?ALPINE_PGPASSWORD is required}
    volumes:
      # Default: named Docker volume. Set ALPINE_DB_PATH=../../database/pgdata
      # to keep the cluster inside the repo instead (Linux/ext4 only; gitignored).
      - ${ALPINE_DB_PATH:-alpine-db-data}:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  face:
    # Face unlock ML service (YuNet + SFace). It owns biometric matching and
    # the tbl_face_verify_log audit; booking rules stay in app. Models are
    # downloaded by face-service/fetch-models.sh and mounted read-only, never
    # baked into the image. The embedding key comes from the stack .env.
    build:
      context: ../../face-service
      dockerfile: Dockerfile
    image: roombooking-face:latest
    environment:
      FACE_DB_DSN: postgresql://${ALPINE_PGUSER:-booking}:${ALPINE_PGPASSWORD:?ALPINE_PGPASSWORD is required}@db:5432/${ALPINE_PGDATABASE:-360booking}
      FACE_EMBEDDING_KEY: ${ALPINE_FACE_EMBEDDING_KEY:?ALPINE_FACE_EMBEDDING_KEY is required}
      FACE_MATCH_THRESHOLD: ${ALPINE_FACE_MATCH_THRESHOLD:-0.60}
      FACE_MATCH_MARGIN: ${ALPINE_FACE_MATCH_MARGIN:-0.05}
      # Shared secret with app; empty disables the header check (dev only).
      FACE_INTERNAL_TOKEN: ${ALPINE_FACE_INTERNAL_TOKEN:-}
    volumes:
      - ../../face-service/models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.alpine
      target: app
    environment:
      NODE_ENV: production
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${ALPINE_PGDATABASE:-360booking}
      PGUSER: ${ALPINE_PGUSER:-booking}
      PGPASSWORD: ${ALPINE_PGPASSWORD:?ALPINE_PGPASSWORD is required}
      # validateRuntimeConfig() reads JWT_SECRET and requires at least 32
      # non-placeholder characters. JWT_SECRET_KEY is kept for parity with
      # older env files but is not read by the current server.
      JWT_SECRET: ${ALPINE_JWT_SECRET:?ALPINE_JWT_SECRET is required}
      JWT_SECRET_KEY: ${ALPINE_JWT_SECRET:?ALPINE_JWT_SECRET is required}
      JWT_EXPIRY_TOKEN: 1d
      JWT_ISSUER: 360-scheduler
      JWT_AUDIENCE: 360-scheduler-web
      KIOSK_JWT_AUDIENCE: 360-scheduler-kiosk
      KIOSK_JWT_EXPIRY: 15m
      KIOSK_REFRESH_DAYS: "30"
      AUDIT_RETENTION_DAYS: "365"
      HOST: 0.0.0.0
      PORT: "8182"
      SERVER_PORT: "9091"
      SSR: "false"
      HTTPS: "false"
      TRUST_PROXY: ${ALPINE_TRUST_PROXY:-1}
      CORS_ORIGINS: ${ALPINE_CORS_ORIGINS:-http://localhost:8082}
      APP_TIMEZONE: Asia/Jakarta
      MAX_BOOKING_DURATION_HOURS: "168"
      MAX_CALENDAR_RANGE_DAYS: "366"
      FLOOR_RESTRICTION: ${ALPINE_FLOOR_RESTRICTION:-true}
      MAX_PREVIEW_CONFLICTS: "50"
      RECURRENCE_MAX_DAYS: "366"
      RECURRENCE_MAX_OCCURRENCES: "200"
      # Internal face service for kiosk face unlock. Server-to-server only; the
      # face service is never exposed outside the Docker network.
      FACE_SERVICE_URL: ${ALPINE_FACE_SERVICE_URL:-http://face:8090}
      FACE_INTERNAL_TOKEN: ${ALPINE_FACE_INTERNAL_TOKEN:-}
      # Set to "false" on every instance except one when scaling out, so the
      # auto-release/backup/retention timers run once.
      RUN_SCHEDULERS: ${ALPINE_RUN_SCHEDULERS:-true}
    depends_on:
      db:
        condition: service_healthy
      face:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:9091/api/health | grep -q '"ok":true'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    ports:
      # Optional direct API access for debugging; nginx is the normal entry.
      - "127.0.0.1:9191:9091"
    restart: unless-stopped
    volumes:
      - backup-data:/backups

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.alpine
      target: web
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8082:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/ | grep -q '<div id="root">'
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  alpine-db-data:
  backup-data:
