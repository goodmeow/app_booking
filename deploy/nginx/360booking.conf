# 360 Scheduler, single origin: the static CMS at the root, API + Socket.io to the
# node bundle on loopback. Nginx is also the TLS / HTTPS termination point (install the
# certificate in the listen 443 block below; add HSTS once HTTPS is confirmed).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10m;

    root /opt/360booking/client;
    index index.html;

    # The browser pulls static files from this same host, so caching can be
    # aggressive for hashed bundles; index is always served fresh for the SPA fallback.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: every path that is not a file goes to index.
    location / {
        try_files $uri /index.html;
    }

    # Plain HTTP API.
    location /api/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.io: the websocket upgrade is required for realtime to work.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # HTTPS: remove the listen 80 block above once fully moved to 443.
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # add_header Strict-Transport-Security "max-age=15552000" always;
}
