# 360 Scheduler, satu origin: statik CMS di root, API + Socket.io ke bundle
# node di loopback. Nginx juga menjadi titik terminate TLS / HTTPS (pasang
# sertifikat di blok listen 443 di bawah; HSTS menyusul setelah HTTPS sure).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10m;

    root /opt/360booking/client;
    index index.html;

    # Origin browser menarik statik dari host ini sendiri, jadi cache cukup
    # agresif untuk bundle ber-hash; index selalu diterima segar bila SPA fallback.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA: semua path bukan berkas mengarah ke index.
    location / {
        try_files $uri /index.html;
    }

    # API HTTP biasa.
    location /api/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.io: websocket upgrade dipersyinkan supaya realtime bekerja.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # HTTPS: hapus blok listen 80 di atas bila sudah pindah penuh ke 443.
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # add_header Strict-Transport-Security "max-age=15552000" always;
}
