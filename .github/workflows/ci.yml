name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build client + server (ke /tmp) dan jalankan seluruh test yang tidak
      # membutuhkan PostgreSQL. Suite paritas/regresi sengaja di luar CI karena
      # membangun ulang database disposable lewat docker compose.
      - run: npm run verify
