name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build the client + server (to /tmp) and run every test that does not
      # need PostgreSQL. The parity/regression suites are deliberately outside CI because
      # they rebuild a disposable database through docker compose.
      - run: npm run verify
