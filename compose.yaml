# Nama project ditetapkan supaya skrip perawatan menemukan kontainer demo
# yang sudah berjalan (tidak perlu COMPOSE_PROJECT_NAME eksternal).
name: 360booking

services:
  postgres-test:
    image: postgres:14-alpine
    container_name: 360booking-postgres-test
    environment:
      POSTGRES_DB: ${BOOKING_TEST_DB:-360booking_reconstruction_test}
      POSTGRES_USER: ${BOOKING_TEST_USER:-booking_test}
      POSTGRES_PASSWORD: ${BOOKING_TEST_PASSWORD:-booking_test_local_only}
    ports:
      - "127.0.0.1:${BOOKING_TEST_PORT:-54320}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - booking-postgres-test-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  booking-postgres-test-data:
